[package]
name = "grove"
version = "0.1.0"
edition = "2024"
description = "Dashboard for Claude Code sessions, in tmux"
license = "MIT"
repository = "https://github.com/ajongaro/grove"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
notify = "8.2.0"
ratatui = "0.30.2"
rmcp = { version = "3.5.1", features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-std"] }
toml = "1.1.6"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
